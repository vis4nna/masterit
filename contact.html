
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style2.css">

    <title>About</title>
</head>

<body>

    <div class="container">

        <div class="navigation">
            <div class="name">
                <h1>MasterIT</h1>
            </div>
            
            <div class="menu">
                <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-menu">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <ul id="primary-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="product.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <a href="shop.html"><i class="fa-solid fa-bag-shopping"></i></a>
                </ul>

                
            </div>
        </div>

    <div class="contact">

        <div class="contact-title">
            <h1>Contact Us</h1>
        </div>

        <div class="input">

            <div class="name">
                <label class="txt" for="">Full Name</label> <br>
                <input class="type" type="text" name="" id="" placeholder="Your Full Name">
            </div> <br>
            
            <div class="email">
                <label class="txt" for="">Email</label> <br>
                <input class="type" type="email" name="" id="" placeholder="Your Email">
            </div> <br>
            
            <div class="message">
                <label class="txt" for="">Your Message</label> <br>  
                <textarea class="type" name="" id="">Type Your Message Here...</textarea>
            </div>

            <div class="btn">
                <button class="btn2" type="submit">Send Message</button>
            </div>
            
        </div>
    </div>

    <script>
        const menu = document.querySelector(".menu");
        const menuToggle = document.querySelector(".menu-toggle");

        menuToggle.addEventListener("click", () => {
            const isOpen = menu.classList.toggle("is-open");
            menuToggle.setAttribute("aria-expanded", String(isOpen));
        });
    </script>
</body>
</html>
